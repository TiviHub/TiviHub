[package]
name = "tivihub"
version = "0.1.0"
description = "TiviHub desktop media library"
authors = ["TiviHub"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chromecast = "0.18.2"
mdns-sd = { version = "0.21.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2.7.2"
url = "2"
