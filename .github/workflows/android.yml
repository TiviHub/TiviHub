name: Android CI and Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests, lint, and debug build
        run: bash gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tivihub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Build and publish signed APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.TIVIHUB_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.TIVIHUB_UPLOAD_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.TIVIHUB_UPLOAD_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.TIVIHUB_UPLOAD_KEY_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_STORE_PASSWORD" || -z "$RELEASE_KEY_ALIAS" || -z "$RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Configure all release-signing repository secrets before pushing a version tag."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/tivihub-release.p12"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          {
            echo "TIVIHUB_UPLOAD_STORE_FILE=$KEYSTORE_PATH"
            echo "TIVIHUB_UPLOAD_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "TIVIHUB_UPLOAD_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "TIVIHUB_UPLOAD_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use the exact format vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: |
          bash gradlew --no-daemon \
            -PreleaseVersionName="$RELEASE_VERSION_NAME" \
            -PreleaseVersionCode="$RELEASE_VERSION_CODE" \
            :app:assembleRelease

      - name: Verify APK signature and create checksum
        env:
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$SIGNER" ]]; then
            echo "::error::Could not find apksigner in the installed Android build tools."
            exit 1
          fi
          "$SIGNER" verify --verbose "$APK"
          cp "$APK" "TiviHub-v${RELEASE_VERSION_NAME}.apk"
          sha256sum "TiviHub-v${RELEASE_VERSION_NAME}.apk" > "TiviHub-v${RELEASE_VERSION_NAME}-SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TiviHub v${{ steps.version.outputs.name }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            TiviHub-v${{ steps.version.outputs.name }}.apk
            TiviHub-v${{ steps.version.outputs.name }}-SHA256SUMS.txt
