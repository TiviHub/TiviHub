name: Android CI and Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests, lint, and debug build
        run: bash gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tivihub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Build signed release APK
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      file_stem: ${{ steps.version.outputs.file_stem }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.TIVIHUB_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.TIVIHUB_UPLOAD_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.TIVIHUB_UPLOAD_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.TIVIHUB_UPLOAD_KEY_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_STORE_PASSWORD" || -z "$RELEASE_KEY_ALIAS" || -z "$RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Configure all release-signing repository secrets before building a release APK."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/tivihub-release.p12"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          {
            echo "TIVIHUB_UPLOAD_STORE_FILE=$KEYSTORE_PATH"
            echo "TIVIHUB_UPLOAD_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "TIVIHUB_UPLOAD_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "TIVIHUB_UPLOAD_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${RELEASE_TAG#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must use the exact format vMAJOR.MINOR.PATCH."
              exit 1
            fi
            FILE_STEM="TiviHub-v${VERSION}"
          else
            VERSION="1.0.0"
            FILE_STEM="TiviHub-main-${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file_stem=$FILE_STEM" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: |
          bash gradlew --no-daemon \
            -PreleaseVersionName="$RELEASE_VERSION_NAME" \
            -PreleaseVersionCode="$RELEASE_VERSION_CODE" \
            :app:assembleRelease

      - name: Verify APK signature and create checksum
        env:
          APK_FILE_STEM: ${{ steps.version.outputs.file_stem }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$SIGNER" ]]; then
            echo "::error::Could not find apksigner in the installed Android build tools."
            exit 1
          fi
          "$SIGNER" verify --verbose "$APK"
          cp "$APK" "${APK_FILE_STEM}.apk"
          sha256sum "${APK_FILE_STEM}.apk" > "${APK_FILE_STEM}-SHA256SUMS.txt"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: tivihub-release-apk-${{ github.run_number }}
          path: |
            ${{ steps.version.outputs.file_stem }}.apk
            ${{ steps.version.outputs.file_stem }}-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish tagged GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: tivihub-release-apk-${{ github.run_number }}
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TiviHub ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            release-assets/${{ needs.release.outputs.file_stem }}.apk
            release-assets/${{ needs.release.outputs.file_stem }}-SHA256SUMS.txt
