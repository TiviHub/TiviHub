name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: TiviHub version
      description: Shown in Settings, or on the Releases page.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Browser mode]
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source type
      options: [M3U file or URL, Xtream, Stalker portal, Not source related]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ..."
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics
      description: Attach the diagnostics file from Settings if you can. Remove playlist addresses and logins first. Never post your username, password or MAC address.
